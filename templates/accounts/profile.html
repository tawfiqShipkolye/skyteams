{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">My Profile</h3>
                <table class="table">
                    <tr>
                        <th>Username</th>
                        <td>{{ user.username }}</td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <td>{{ user.email }}</td>
                    </tr>
                    <tr>
                        <th>First Name</th>
                        <td>{{ user.first_name }}</td>
                    </tr>
                    <tr>
                        <th>Last Name</th>
                        <td>{{ user.last_name }}</td>
                    </tr>
                    <tr>
                        <th>Date Joined</th>
                        <td>{{ user.date_joined|date:"d M Y" }}</td>
                    </tr>
                </table>
                <a href="{% url 'inbox' %}" class="btn btn-primary">Go to Inbox</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger ms-2">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

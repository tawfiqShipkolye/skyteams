{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Inbox</h3>
    <a href="{% url 'compose' %}" class="btn btn-primary">+ New Message</a>
</div>
<div class="card shadow">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>From</th>
                    <th>Subject</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for msg in messages_list %}
                <tr class="message-row {% if not msg.is_read %}unread{% endif %}" 
                    onclick="window.location='{% url 'view_message' msg.pk %}'">
                    <td>{{ msg.sender.username }}</td>
                    <td>{{ msg.subject }}</td>
                    <td>{{ msg.created_at|date:"d M Y H:i" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">No messages in your inbox.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
